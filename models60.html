<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>60㎡ Granny Flat — A60 / B60 / C60 / D60 | Aus Granny Flat</title>
  <meta name="description" content="Compare A60, B60, C60 and D60 modular granny flat floor plans — 60㎡ two-bedroom layouts for Australian backyards." />
  <meta property="og:title" content="60㎡ Granny Flat — A60 · B60 · C60 · D60" />
  <meta property="og:description" content="Four 60㎡ modular granny flat floor plans. Tap to compare A60, B60, C60 and D60." />

  <meta property="og:image:height" content="1224" />

  <link rel="canonical" href="https://www.ausgrannyflat.com/m/60" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #2563eb;
      --brand-deep: #1d4ed8;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --card: #ffffff;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 100% -10%, rgba(37, 99, 235, 0.12), transparent 55%),
        radial-gradient(90% 60% at 0% 0%, rgba(15, 23, 42, 0.06), transparent 50%),
        var(--surface);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }

    .top {
      padding: calc(0.85rem + var(--safe-t)) 1rem 0.5rem;
      max-width: 40rem;
      margin: 0 auto;
    }
    .brand {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .top h1 {
      margin: 0.35rem 0 0.25rem;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.85rem, 7vw, 2.35rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .top p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 28rem;
    }

    /* First viewport: four index cards */
    .index {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1rem 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      min-height: calc(100svh - 8.5rem);
      align-content: start;
    }
    .index-card {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      background: var(--card);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04), 0 10px 28px rgba(15, 23, 42, 0.08);
      transform: translateZ(0);
      transition: transform 180ms ease, box-shadow 180ms ease;
      animation: rise 520ms ease both;
    }
    .index-card:nth-child(2) { animation-delay: 60ms; }
    .index-card:nth-child(3) { animation-delay: 120ms; }
    .index-card:nth-child(4) { animation-delay: 180ms; }
    .index-card:active { transform: scale(0.98); }
    .index-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e8eef7;
    }
    .index-card .meta {
      padding: 0.7rem 0.75rem 0.85rem;
    }
    .index-card .code {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .index-card .specs {
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }
    .index-card .hint {
      margin-top: 0.35rem;
      font-size: 0.7rem;
      color: var(--brand);
      font-weight: 700;
    }

    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 250, 252, 0.88);
      border-bottom: 1px solid var(--line);
      padding: 0.55rem 0.75rem calc(0.55rem);
    }
    .sticky-nav .row {
      max-width: 40rem;
      margin: 0 auto;
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sticky-nav .row::-webkit-scrollbar { display: none; }
    .sticky-nav a {
      flex: 0 0 auto;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .sticky-nav a.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .detail {
      max-width: 40rem;
      margin: 0 auto;
      padding: 0.5rem 1rem calc(5rem + var(--safe-b));
    }
    .model {
      scroll-margin-top: 3.5rem;
      margin: 1.5rem 0 2.25rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      animation: rise 600ms ease both;
    }
    .model:last-child { border-bottom: 0; }
    .model .eyebrow {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .model h2 {
      margin: 0.25rem 0 0.35rem;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.45rem, 5.5vw, 1.85rem);
      line-height: 1.2;
    }
    .model .sub {
      margin: 0 0 0.85rem;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .chip {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--brand-deep);
    }
    .gallery {
      display: flex;
      gap: 0.65rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 0.35rem;
      margin: 0 -1rem 1rem;
      padding-left: 1rem;
      padding-right: 1rem;
      scrollbar-width: thin;
    }
    .gallery img {
      flex: 0 0 86%;
      max-width: 22rem;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 0.9rem;
      scroll-snap-align: start;
      background: #e8eef7;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
    }
    .desc {
      margin: 0;
      font-size: 0.95rem;
      color: #334155;
    }
    .zh {
      margin: 0.75rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .more {
      display: inline-flex;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brand);
    }

    .fab {
      position: fixed;
      right: 1rem;
      bottom: calc(1rem + var(--safe-b));
      z-index: 30;
      width: 2.75rem;
      height: 2.75rem;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 1.1rem;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .fab.show { opacity: 1; pointer-events: auto; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 720px) {
      .index { grid-template-columns: repeat(4, 1fr); min-height: auto; }
      .gallery img { flex-basis: 48%; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Aus Granny Flat</div>
    <h1>60㎡ floor plans</h1>
    <p>Tap a model to jump to photos and full details. Built for mobile browsing.</p>
  </header>

  <nav class="index" id="index" aria-label="60㎡ model index">
    <!-- filled by JS -->
  </nav>

  <div class="sticky-nav" id="sticky" aria-label="Quick jump">
    <div class="row" id="sticky-row"></div>
  </div>

  <main class="detail" id="detail"></main>

  <button type="button" class="fab" id="to-top" aria-label="Back to index">↑</button>

  <script>
    // Same-origin on ausgrannyflat.com; keep absolute fallback for bot host
    const CDN = location.hostname.includes("ausgrannyflat.com")
      ? ""
      : "https://www.ausgrannyflat.com";
    const MODELS = [
      {
        code: "A60",
        id: "0d50f83b-02bc-4ddd-87f5-1a075daebf1b",
        title_en: "A60 | Two‑Bedroom Open‑Plan Granny Flat",
        subtitle_en: "Comfortable Living with Active/Quiet Zoning",
        description_en: "Dual bedroom layout, bathroom/laundry combined, open-plan living/kitchen/dining. Both bedrooms equipped with double-door wardrobes, outdoor terrace with porch, compact and practical space, suitable for Australian backyard accessory dwelling.",
        title_zh: "A60｜双卧一体 GrannyFlat",
        subtitle_zh: "动静分区的舒适居住方案",
        description_zh: "双卧室布局，卫浴洗衣合并，开放式客餐厨一体。两间卧室均配双门衣柜，户外带露台门廊，空间紧凑实用，适配澳洲后院附属住宅。",
        area: "60㎡",
        bedrooms: 2,
        bathrooms: 1,
        image: "/GrannyFlat/60sqm/A60-5.jpg",
        gallery: [
          "/GrannyFlat/60sqm/A60-5.jpg",
          "/GrannyFlat/60sqm/A60-1.jpg",
          "/GrannyFlat/60sqm/A60-3.jpg",
          "/GrannyFlat/60sqm/A60-4.jpg",
          "/GrannyFlat/60sqm/A60.jpg"
        ]
      },
      {
        code: "B60",
        id: "0b9bd319-5f57-4000-8efa-eb853fc7848f",
        title_en: "B60 | Two‑Bedroom Island‑Kitchen Granny Flat",
        subtitle_en: "Dual Bedrooms & Bathrooms | Kitchen Island",
        description_en: "Symmetrical dual bedrooms, independent bathroom + separate laundry room, kitchen with island. Both bedrooms equipped with wardrobes, outdoor terrace extends activity area, suitable for dual-person family living with strong privacy.",
        title_zh: "B60｜双卧岛台 GrannyFlat",
        subtitle_zh: "双卧双卫，带中岛餐厨空间",
        description_zh: "对称双卧，独立卫浴 + 独立洗衣房，厨房配置中岛台。卧室均配衣柜，户外露台拓展活动区，适合双人家庭居住，隐私性强。",
        area: "60㎡",
        bedrooms: 2,
        bathrooms: 2,
        image: "/GrannyFlat/60sqm/B60-2.jpg",
        gallery: [
          "/GrannyFlat/60sqm/B60-2.jpg",
          "/GrannyFlat/60sqm/B60-1.jpg",
          "/GrannyFlat/60sqm/B60-3.jpg",
          "/GrannyFlat/60sqm/B60.jpg"
        ]
      },
      {
        code: "C60",
        id: "73cd7ad5-ab71-43c7-9d06-16af63c659e8",
        title_en: "C60 | Two‑Bedroom Entry‑Foyer Granny Flat",
        subtitle_en: "Entry Hallway | Rich Functional Zoning",
        description_en: "Independent entry hallway, living room with desk area, connected kitchen/dining. Dual bedrooms with wardrobes, bathroom/laundry combined, outdoor terrace. Smooth circulation, ideal for retirement or independent living.",
        title_zh: "C60｜入户玄关双卧 GrannyFlat",
        subtitle_zh: "玄关入户，功能分区丰富",
        description_zh: "独立玄关入户，客厅带书桌位，餐厨连贯。双卧室配衣柜，卫浴洗衣合一，户外露台，动线流畅，适合养老或独立居住。",
        area: "60㎡",
        bedrooms: 2,
        bathrooms: 1,
        image: "/GrannyFlat/60sqm/C60-2.jpg",
        gallery: [
          "/GrannyFlat/60sqm/C60-2.jpg",
          "/GrannyFlat/60sqm/C60-1.jpg",
          "/GrannyFlat/60sqm/C60-3.jpg",
          "/GrannyFlat/60sqm/C60.jpg"
        ]
      },
      {
        code: "D60",
        id: "4d847251-47e5-49ad-895a-1f9a3d912e03",
        title_en: "D60 | Two-Bedroom Foyer Entry Granny Flat (Flat Roof)",
        subtitle_en: "Entry Hallway | Rich Functional Zoning | Economical & Practical",
        description_en: "Independent entry hallway, living room with desk area, connected kitchen/dining. Two bedrooms with wardrobes, combined bathroom/laundry, outdoor deck. Smooth circulation, ideal for retirement or independent living. Economical and practical.",
        title_zh: "D60｜入户玄关双卧 GrannyFlat（平屋顶）",
        subtitle_zh: "玄关入户，功能分区丰富，经济实用",
        description_zh: "独立玄关入户，客厅带书桌位，餐厨连贯。双卧室配衣柜，卫浴洗衣合一，户外露台，动线流畅，适合养老或独立居住，经济实用。",
        area: "60㎡",
        bedrooms: 2,
        bathrooms: 1,
        image: "/GrannyFlat/60sqm/D60-2.jpg",
        gallery: [
          "/GrannyFlat/60sqm/D60-2.jpg",
          "/GrannyFlat/60sqm/D60-1.jpg",
          "/GrannyFlat/60sqm/D60-3.jpg",
          "/GrannyFlat/60sqm/D60.jpg"
        ]
      }
    ];

    function abs(path) {
      if (!path) return "";
      if (path.startsWith("http")) return path;
      return CDN + path;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const indexEl = document.getElementById("index");
    const detailEl = document.getElementById("detail");
    const stickyRow = document.getElementById("sticky-row");

    indexEl.innerHTML = MODELS.map((m) => `
      <a class="index-card" href="#${m.code}">
        <img src="${esc(abs(m.image))}" alt="${esc(m.code)}" loading="eager" />
        <div class="meta">
          <div class="code">${esc(m.code)}</div>
          <div class="specs">${esc(m.area)} · ${m.bedrooms} Bed · ${m.bathrooms} Bath</div>
          <div class="hint">View details →</div>
        </div>
      </a>
    `).join("");

    stickyRow.innerHTML = MODELS.map((m) =>
      `<a href="#${m.code}" data-code="${m.code}">${esc(m.code)}</a>`
    ).join("") + `<a href="#index">All</a>`;

    detailEl.innerHTML = MODELS.map((m) => `
      <section class="model" id="${m.code}">
        <div class="eyebrow">${esc(m.code)}</div>
        <h2>${esc(m.title_en)}</h2>
        <p class="sub">${esc(m.subtitle_en)}</p>
        <div class="chips">
          <span class="chip">${esc(m.area)}</span>
          <span class="chip">${m.bedrooms} Bed</span>
          <span class="chip">${m.bathrooms} Bath</span>
        </div>
        <div class="gallery">
          ${m.gallery.map((g, i) =>
            `<img src="${esc(abs(g))}" alt="${esc(m.code)} photo ${i + 1}" loading="${i ? "lazy" : "eager"}" />`
          ).join("")}
        </div>
        <p class="desc">${esc(m.description_en)}</p>
        <p class="zh">${esc(m.description_zh)}</p>
        <a class="more" href="${CDN}/products/granny-flat/${m.id}" target="_blank" rel="noopener">
          Open full product page →
        </a>
      </section>
    `).join("");

    const fab = document.getElementById("to-top");
    const links = [...stickyRow.querySelectorAll("a[data-code]")];

    function syncActive() {
      const y = window.scrollY + 120;
      let current = MODELS[0].code;
      for (const m of MODELS) {
        const el = document.getElementById(m.code);
        if (el && el.offsetTop <= y) current = m.code;
      }
      links.forEach((a) => a.classList.toggle("active", a.dataset.code === current));
      fab.classList.toggle("show", window.scrollY > 420);
    }

    fab.addEventListener("click", () => {
      document.getElementById("index").scrollIntoView({ behavior: "smooth" });
    });
    window.addEventListener("scroll", syncActive, { passive: true });
    syncActive();
  </script>
</body>
</html>

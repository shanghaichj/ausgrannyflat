# ============================================================
# Aus Granny Flat - Nginx 站点配置
# 适用: 腾讯云 CVM (Linux) + Nginx
# 放置: /etc/nginx/conf.d/ausgrannyflat.conf  (或宝塔站点配置)
# 修改: 将 YOUR_DOMAIN 替换为你的域名
# ============================================================

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # 网站根目录(按实际路径修改)
    root /var/www/ausgrannyflat;
    index index.html;

    # ---------- 静态资源缓存 ----------
    location ~* \.(css|js|woff2|jpg|jpeg|png|webp|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- 页面路由(伪静态路径 -> HTML 文件) ----------
    location = / {
        try_files /index.html =404;
    }

    location = /products/granny-flat {
        try_files /products_granny-flat.html =404;
    }

    location = /contact {
        try_files /contact.html =404;
    }

    # ---------- 数据 API -> 静态 JSON (保留原站动态加载逻辑) ----------
    location = /api/admin/products {
        alias /var/www/ausgrannyflat/_data/products.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /api/rolling-images {
        alias /var/www/ausgrannyflat/_data/rolling-images.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /api/intro-images {
        alias /var/www/ausgrannyflat/_data/intro-images.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # ---------- 联系表单提交 -> PHP 脚本(发邮件/落盘) ----------
    location = /api/contact {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # 按服务器 PHP 版本调整
        fastcgi_param SCRIPT_FILENAME $document_root/_deploy/contact-handler.php;
        include fastcgi_params;
        fastcgi_param REQUEST_METHOD POST;
        fastcgi_read_timeout 30s;
    }

    # ---------- 404 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Box-15 Studio Granny Flat | Aus Granny Flat</title>
  <meta name="description" content="Box-15 compact studio granny flat — mobile photo gallery and full details." />
  <meta property="og:title" content="Box-15 | Basic Studio Granny Flat" />
  <meta property="og:description" content="Compact 15㎡ studio granny flat with mini kitchen and bathroom/laundry." />
  <meta property="og:image" content="https://www.ausgrannyflat.com/og-box15.jpg?v=2" />
  <meta property="og:image:secure_url" content="https://www.ausgrannyflat.com/og-box15.jpg?v=2" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Box-15 studio granny flat" />
  <meta property="og:url" content="https://www.ausgrannyflat.com/m/15" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Aus Granny Flat" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Box-15 | Basic Studio Granny Flat" />
  <meta name="twitter:description" content="Compact 15㎡ studio granny flat with mini kitchen and bathroom/laundry." />
  <meta name="twitter:image" content="https://www.ausgrannyflat.com/og-box15.jpg?v=2" />
  <link rel="canonical" href="https://www.ausgrannyflat.com/m/15" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #2563eb;
      --brand-deep: #1d4ed8;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --card: #ffffff;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 100% -10%, rgba(37, 99, 235, 0.12), transparent 55%),
        radial-gradient(90% 60% at 0% 0%, rgba(15, 23, 42, 0.06), transparent 50%),
        var(--surface);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }
    .top {
      padding: calc(0.85rem + var(--safe-t)) 1rem 0.5rem;
      max-width: 40rem;
      margin: 0 auto;
    }
    .brand {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .top h1 {
      margin: 0.35rem 0 0.25rem;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.85rem, 7vw, 2.35rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .top p { margin: 0; color: var(--muted); font-size: 0.92rem; max-width: 28rem; }
    .index {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1rem 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      min-height: calc(100svh - 8.5rem);
      align-content: start;
    }
    .index.single { grid-template-columns: 1fr; min-height: auto; }
    .index-card {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      background: var(--card);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04), 0 10px 28px rgba(15, 23, 42, 0.08);
      animation: rise 520ms ease both;
    }
    .index-card:nth-child(2) { animation-delay: 60ms; }
    .index-card:nth-child(3) { animation-delay: 120ms; }
    .index-card:nth-child(4) { animation-delay: 180ms; }
    .index-card:active { transform: scale(0.98); }
    .index-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e8eef7;
    }
    .index.single .index-card img { aspect-ratio: 16 / 10; }
    .index-card .meta { padding: 0.7rem 0.75rem 0.85rem; }
    .index-card .code { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
    .index-card .specs { margin-top: 0.2rem; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
    .index-card .hint { margin-top: 0.35rem; font-size: 0.7rem; color: var(--brand); font-weight: 700; }
    .sticky-nav {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 250, 252, 0.88);
      border-bottom: 1px solid var(--line);
      padding: 0.55rem 0.75rem;
    }
    .sticky-nav.hidden { display: none; }
    .sticky-nav .row {
      max-width: 40rem; margin: 0 auto; display: flex; gap: 0.4rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .sticky-nav .row::-webkit-scrollbar { display: none; }
    .sticky-nav a {
      flex: 0 0 auto; padding: 0.45rem 0.85rem; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; background: #fff;
      border: 1px solid var(--line); color: var(--ink);
    }
    .sticky-nav a.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .detail { max-width: 40rem; margin: 0 auto; padding: 0.5rem 1rem calc(5rem + var(--safe-b)); }
    .model { scroll-margin-top: 3.5rem; margin: 1.5rem 0 2.25rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
    .model:last-child { border-bottom: 0; }
    .model .eyebrow {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--brand);
    }
    .model h2 {
      margin: 0.25rem 0 0.35rem;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.45rem, 5.5vw, 1.85rem);
      line-height: 1.2;
    }
    .model .sub { margin: 0 0 0.85rem; color: var(--muted); font-size: 0.92rem; font-weight: 500; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .chip {
      font-size: 0.75rem; font-weight: 700; padding: 0.35rem 0.65rem;
      border-radius: 999px; background: rgba(37, 99, 235, 0.1); color: var(--brand-deep);
    }
    .gallery {
      display: flex; gap: 0.65rem; overflow-x: auto; scroll-snap-type: x mandatory;
      padding-bottom: 0.35rem; margin: 0 -1rem 1rem; padding-left: 1rem; padding-right: 1rem;
      scrollbar-width: thin;
    }
    .gallery img {
      flex: 0 0 86%; max-width: 22rem; aspect-ratio: 4 / 3; object-fit: cover;
      border-radius: 0.9rem; scroll-snap-align: start; background: #e8eef7;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
    }
    .gallery.stack {
      display: grid; gap: 0.85rem; overflow: visible; scroll-snap-type: none;
      margin: 0 0 1rem; padding: 0;
    }
    .gallery.stack img {
      flex: none; width: 100%; max-width: none; aspect-ratio: auto; object-fit: contain;
      scroll-snap-align: unset; border-radius: 0.9rem;
    }
    .desc { margin: 0; font-size: 0.95rem; color: #334155; }
    .zh { margin: 0.75rem 0 0; font-size: 0.88rem; color: var(--muted); }
    .stack-page .index, .stack-page .sticky-nav { display: none !important; }
    .stack-page .model { margin-top: 0.5rem; border-bottom: 0; padding-bottom: 0; }
    .stack-page .top .sub { margin: 0.35rem 0 0.75rem; color: var(--muted); font-size: 0.92rem; font-weight: 500; }
    .stack-page .top .desc { margin: 0.85rem 0 0; font-size: 0.95rem; color: #334155; }
    .stack-page .top .chips { margin-bottom: 0; }
    .more { display: inline-flex; margin-top: 0.9rem; font-size: 0.85rem; font-weight: 700; color: var(--brand); }
    .fab {
      position: fixed; right: 1rem; bottom: calc(1rem + var(--safe-b)); z-index: 30;
      width: 2.75rem; height: 2.75rem; border: 0; border-radius: 999px;
      background: var(--ink); color: #fff; font-size: 1.1rem;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25); cursor: pointer;
      opacity: 0; pointer-events: none; transition: opacity 200ms ease;
    }
    .fab.show { opacity: 1; pointer-events: auto; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (min-width: 720px) {
      .index:not(.single) { grid-template-columns: repeat(4, 1fr); min-height: auto; }
      .gallery img { flex-basis: 48%; }
    }
</style>
</head>
<body class="stack-page">
  <header class="top">
    <div class="brand">Aus Granny Flat</div>
    <h1>Box-15 | Basic Studio Granny Flat (Multi Layouts)</h1>
    <p class="sub">Compact Bedroom | Mini Kitchen | Bathroom/Laundry</p>
    <div class="chips">
      <span class="chip">15㎡</span>
      <span class="chip">1 Bed</span>
      <span class="chip">1 Bath</span>
    </div>
    <p class="desc">Compact one-bedroom with mini kitchen and integrated bathroom/laundry. Ideal for single occupancy or short-term rental.</p>
  </header>

  <nav class="index single" id="index" aria-label="Model index"></nav>
  <div class="sticky-nav hidden" id="sticky" aria-label="Quick jump">
    <div class="row" id="sticky-row"></div>
  </div>
  <main class="detail" id="detail"></main>
  <button type="button" class="fab" id="to-top" aria-label="Back to top">↑</button>

  <script>
    const CDN = location.hostname.includes("ausgrannyflat.com")
      ? ""
      : "https://www.ausgrannyflat.com";
    const MODELS = [
  {
    "code": "Box-15",
    "id": "dfdce97c-5d2a-4ecd-8397-93d5fabf926f",
    "title_en": "Box-15 | Basic Studio Granny Flat (Multi Layouts)",
    "subtitle_en": "Compact Bedroom | Mini Kitchen | Bathroom/Laundry",
    "description_en": "Compact one-bedroom with mini kitchen and integrated bathroom/laundry. Ideal for single occupancy or short-term rental.",
    "area": "15㎡",
    "bedrooms": 1,
    "bathrooms": 1,
    "image": "/Box Series/15 Series/C15-1.jpg",
    "gallery": [
      "/Box Series/15 Series/C15-1.jpg",
      "/Box Series/15 Series/A15-2.jpg",
      "/Box Series/15 Series/A15-1.jpg",
      "/Box Series/15 Series/A15-5.jpg",
      "/Box Series/15 Series/A15.jpg",
      "/Box Series/15 Series/B15.jpg",
      "/Box Series/15 Series/C15.jpg"
    ]
  }
];
    const SHOW_INDEX = false;
    const SHOW_ZH = false;

    function abs(path) {
      if (!path) return "";
      if (path.startsWith("http")) return path;
      return CDN + path.split("/").map(encodeURIComponent).join("/").replace(/%2F/g, "/");
    }
    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const indexEl = document.getElementById("index");
    const detailEl = document.getElementById("detail");
    const stickyRow = document.getElementById("sticky-row");

    if (SHOW_INDEX) {
      indexEl.innerHTML = MODELS.map((m) => `
        <a class="index-card" href="#${m.code}">
          <img src="${esc(abs(m.image))}" alt="${esc(m.code)}" loading="eager" />
          <div class="meta">
            <div class="code">${esc(m.code)}</div>
            <div class="specs">${esc(m.area)} · ${m.bedrooms} Bed · ${m.bathrooms} Bath</div>
            <div class="hint">View details →</div>
          </div>
        </a>
      `).join("");
    } else {
      indexEl.innerHTML = "";
    }

    if (stickyRow && SHOW_INDEX) {
      stickyRow.innerHTML = MODELS.map((m) =>
        `<a href="#${m.code}" data-code="${m.code}">${esc(m.code)}</a>`
      ).join("") + (MODELS.length > 1 ? `<a href="#index">All</a>` : "");
    }

    detailEl.innerHTML = MODELS.map((m) => `
      <section class="model" id="${m.code}">
        <div class="gallery stack">
          ${m.gallery.map((g, i) =>
            `<img src="${esc(abs(g))}" alt="${esc(m.code)} photo ${i + 1}" loading="${i ? "lazy" : "eager"}" />`
          ).join("")}
        </div>
        <a class="more" href="${CDN}/products/granny-flat/${m.id}" target="_blank" rel="noopener">
          Open full product page →
        </a>
      </section>
    `).join("");

    const fab = document.getElementById("to-top");
    const links = stickyRow ? [...stickyRow.querySelectorAll("a[data-code]")] : [];
    function syncActive() {
      const y = window.scrollY + 120;
      let current = MODELS[0].code;
      for (const m of MODELS) {
        const el = document.getElementById(m.code);
        if (el && el.offsetTop <= y) current = m.code;
      }
      links.forEach((a) => a.classList.toggle("active", a.dataset.code === current));
      fab.classList.toggle("show", window.scrollY > 420);
    }
    fab.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    window.addEventListener("scroll", syncActive, { passive: true });
    syncActive();
  </script>
</body>
</html>
